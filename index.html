<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Livro de Contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B4FE9">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#F3F4F8; --card:#FFFFFF; --chip:#F1F1F8;
    --ink:#14161F; --ink-soft:#6B7280; --line:#E7E8EF;
    --primary:#5B4FE9; --primary-ink:#FFFFFF; --primary-soft:#ECEAFD;
    --success:#0EA968; --success-soft:#E3F7EE;
    --danger:#E23F5E; --danger-soft:#FCE7EB;
    --warn:#DB8A11; --warn-soft:#FBF0DC;
    --shadow:0 1px 2px rgba(20,22,31,0.04), 0 6px 16px rgba(20,22,31,0.06);
    --radius:18px; --radius-sm:12px;
  }
  [data-theme="dark"]{
    --bg:#0E0F16; --card:#1A1C27; --chip:#242631;
    --ink:#EEEFF5; --ink-soft:#98A0B3; --line:#2B2E3B;
    --primary:#8C82FF; --primary-ink:#12131C; --primary-soft:rgba(140,130,255,0.16);
    --success:#3FDB94; --success-soft:rgba(63,219,148,0.14);
    --danger:#FF7288; --danger-soft:rgba(255,114,136,0.14);
    --warn:#F5B441; --warn-soft:rgba(245,180,65,0.14);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .2s,color .2s;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:80px;}
  header.top{padding:20px 18px 14px;background:var(--bg);position:sticky;top:0;z-index:5;}
  .headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  header.top .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);margin:0 0 4px;font-weight:600;}
  header.top h1{font-weight:800;font-size:24px;margin:0;letter-spacing:-0.02em;color:var(--ink);}
  header.top .sub{font-size:13px;color:var(--ink-soft);margin-top:5px;}
  .theme-toggle{background:var(--chip);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .theme-toggle svg{width:18px;height:18px;stroke:var(--ink);fill:none;}
  main{flex:1;padding:14px 16px 8px;}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card h2{font-size:16px;margin:0 0 10px;font-weight:700;letter-spacing:-0.01em;}
  .card h3{font-size:14.5px;margin:0 0 8px;font-weight:700;letter-spacing:-0.01em;}
  .stat-row{display:flex;gap:10px;margin-bottom:12px;}
  .stat{flex:1;background:var(--chip);border-radius:var(--radius-sm);padding:11px 13px;}
  .stat .label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .stat .value{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;margin-top:3px;color:var(--ink);}
  .stat.pos .value{color:var(--success);} .stat.neg .value{color:var(--danger);}
  .bar-track{height:8px;border-radius:5px;background:var(--chip);overflow:hidden;}
  .bar-fill{height:100%;background:var(--success);}
  .unit-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;}
  .unit-row:first-child{border-top:none;}
  .unit-name{font-weight:600;font-size:14px;}
  .unit-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .unit-pct{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:var(--chip);color:var(--ink-soft);white-space:nowrap;cursor:pointer;}
  .pill.on{background:var(--success-soft);border-color:var(--success);color:var(--success);}
  button.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border-radius:var(--radius-sm);border:none;background:var(--ink);color:var(--bg);padding:11px 16px;cursor:pointer;}
  button.btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  button.btn.gold{background:var(--primary);color:var(--primary-ink);}
  button.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
  button.btn.small{padding:7px 12px;font-size:12.5px;border-radius:10px;}
  button.btn.block{width:100%;}
  button.btn:active{opacity:.8;}
  button.btn:disabled{opacity:.4;cursor:default;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=password],.field select{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.data th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.data td{padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.data td input, table.data td select{font-family:'Inter',sans-serif;font-size:12.5px;padding:6px 7px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);width:88px;}
  table.data td input[type=date]{width:120px;}
  table.data td.obs input{width:120px;}
  table.data tr.current-month td{background:var(--primary-soft);}
  .table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px;}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13px;text-decoration:none;margin-bottom:12px;cursor:pointer;background:none;border:none;padding:0;font-family:'Inter',sans-serif;font-weight:600;}
  .tx{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer;}
  .tx:first-child{border-top:none;}
  .tx-desc{font-size:13.5px;font-weight:600;}
  .tx-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .tx-val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .tx-val.pos{color:var(--success);} .tx-val.neg{color:var(--danger);}
  nav.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);}
  nav.bottomnav button{flex:1;padding:10px 2px 9px;background:none;border:none;font-family:'Inter',sans-serif;font-size:10.5px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;font-weight:500;}
  nav.bottomnav button svg{width:19px;height:19px;stroke:var(--ink-soft);fill:none;}
  nav.bottomnav button.active{color:var(--primary);} nav.bottomnav button.active svg{stroke:var(--primary);}
  .navdot{position:absolute;top:5px;right:26%;width:8px;height:8px;border-radius:50%;background:var(--danger);border:1.5px solid var(--card);display:none;}
  .empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:22px 8px;}
  .helpbox{font-size:13px;line-height:1.6;color:var(--ink-soft);}
  .helpbox strong{color:var(--ink);}
  .alert-item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer;}
  .alert-item:first-child{border-top:none;}
  .alert-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .alert-dot.renda{background:var(--danger);} .alert-dot.condominio{background:var(--warn);} .alert-dot.imi{background:var(--ink-soft);} .alert-dot.lembrete{background:var(--primary);}
  .alert-label{font-size:13px;font-weight:600;}
  .alert-unit{font-size:11.5px;color:var(--ink-soft);}
  .chart-legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .chart-legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;}
  .row-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .warn-box{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;margin-top:10px;}
  #lockScreen{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;}
  #lockScreen .box{max-width:340px;width:100%;text-align:center;}
  #lockScreen h1{font-size:21px;margin-bottom:4px;font-weight:800;}
  #lockScreen p{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  #lockScreen input{width:100%;text-align:center;font-size:22px;letter-spacing:.3em;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:12px;font-family:'IBM Plex Mono',monospace;color:var(--ink);}
  #lockScreen .err{color:var(--danger);font-size:12.5px;min-height:18px;margin-bottom:8px;}
  #printArea{display:none;}
  @media print{
    #app{display:none !important;}
    #lockScreen{display:none !important;}
    #printArea{display:block !important;background:#fff;color:#000;padding:0;}
  }
  .printhead{font-weight:800;font-size:20px;margin-bottom:2px;}
  .printsub{font-size:11px;color:#5A6B85;margin-bottom:16px;}
  .printsection{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5B4FE9;margin:18px 0 6px;}
  table.printtable{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px;}
  table.printtable th{background:#14161F;color:#fff;text-align:left;padding:5px 6px;}
  table.printtable td{padding:4px 6px;border-bottom:1px solid #E7E8EF;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="headrow">
      <div>
        <p class="eyebrow">Livro de Contas</p>
        <h1 id="pageTitle">Resumo</h1>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
        <svg id="themeIcon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
      </button>
    </div>
    <p class="sub" id="pageSub">Imóveis, vagas e despesas do dia a dia</p>
  </header>
  <main id="view-root"></main>
  <nav class="bottomnav">
    <button data-view="dashboard">
      <span class="navdot" id="navDot"></span>
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      Resumo
    </button>
    <button data-view="unidades">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-8h6v8"/></svg>
      Unidades
    </button>
    <button data-view="lembretes">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      Lembretes
    </button>
    <button data-view="despesas">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      Despesas
    </button>
    <button data-view="ajuda">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .3c0 1.7-2.3 1.8-2.3 3.7M12 17h.01"/></svg>
      Ajuda
    </button>
  </nav>
</div>
<div id="printArea"></div>

<script>
const MESES = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const CATS = ["Salário","Gratificação","Renda Recebida","Alimentação","Transporte","Saúde","Casa","Lazer","Educação","IMI","Condomínio","Outros"];
const CAT_LEMBRETES = ["Água","Eletricidade","Gás","Telecomunicações","Seguro","Outro"];
const CUR_MONTH = new Date().getMonth();

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function simpleHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=((h<<5)-h)+str.charCodeAt(i); h|=0; } return String(h); }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

const MOON_PATH = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
const SUN_PATH = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('financas-theme', t);
  const icon = document.getElementById('themeIcon');
  if(icon) icon.innerHTML = t==='dark' ? SUN_PATH : MOON_PATH;
}
function initTheme(){
  const saved = localStorage.getItem('financas-theme');
  const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
}

function seedUnit(i){
  return {
    id: uid(), nome: "Unidade "+i, tipo: "Imóvel", inquilino: "", rendaMensal: 0, reciboNecessario: true,
    months: MESES.map(m => ({mes:m, recebida:false, valor:0, data:"", reciboEmitido:"N/A", condominioPago:false, valorCondominio:0, obs:""})),
    imi: [
      {label:"1ª Prestação", valor:0, pago:false, data:""},
      {label:"2ª Prestação", valor:0, pago:false, data:""},
      {label:"3ª Prestação", valor:0, pago:false, data:""}
    ]
  };
}
function seedReminder(nome, categoria){
  return { id: uid(), nome, categoria, valorHabitual: 0, months: MESES.map(m=>({mes:m, pago:false, valor:0, data:""})) };
}
function seedReminders(){ return [seedReminder("Água","Água"), seedReminder("Eletricidade","Eletricidade"), seedReminder("Internet / TV","Telecomunicações")]; }
function seedState(){
  return {
    units: [1,2,3,4,5].map(seedUnit),
    expenses: [{id:uid(), data:todayStr(), descricao:"Ordenado", categoria:"Salário", tipo:"Receita", valor:1500}],
    transfers: [],
    reminders: seedReminders()
  };
}

let state = null;
let view = "dashboard";
let currentUnitId = null;
let currentReminderId = null;
let editingTx = null;
let editingTransfer = null;
let editingReminder = null;

async function loadState(){
  try{
    const raw = localStorage.getItem("financas-v1");
    if(raw){
      state = JSON.parse(raw);
      if(!state.transfers) state.transfers = [];
      if(!state.reminders) state.reminders = seedReminders();
      return;
    }
  }catch(e){ console.error("Erro ao ler dados guardados:", e); }
  state = seedState();
  persist();
}
function persist(){
  try{ localStorage.setItem("financas-v1", JSON.stringify(state)); }
  catch(e){ console.error("Erro ao guardar:", e); }
}

function fmt(n){ n = Number(n)||0; return n.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }

function unitTotals(u){
  const recebido = u.months.reduce((s,m)=> s + (m.recebida? Number(m.valor)||0 : 0), 0);
  const condo = u.months.reduce((s,m)=> s + (m.condominioPago? Number(m.valorCondominio)||0 : 0), 0);
  const imiTotal = u.imi.reduce((s,r)=> s + (Number(r.valor)||0), 0);
  const imiPago = u.imi.reduce((s,r)=> s + (r.pago? Number(r.valor)||0 : 0), 0);
  const esperado = (Number(u.rendaMensal)||0) * 12;
  const pct = esperado>0 ? Math.min(100, Math.round((recebido/esperado)*100)) : 0;
  const transfersIn = state.transfers.filter(t=>t.destino===u.id).reduce((s,t)=>s+(Number(t.valor)||0),0);
  const transfersOut = state.transfers.filter(t=>t.origem===u.id).reduce((s,t)=>s+(Number(t.valor)||0),0);
  const saldo = recebido - condo - imiPago + transfersIn - transfersOut;
  return {recebido, condo, imiTotal, imiPago, esperado, pct, transfersIn, transfersOut, saldo};
}
function reminderTotals(r){
  const pago = r.months.reduce((s,m)=> s + (m.pago? Number(m.valor)||0 : 0), 0);
  const pendentes = r.months.reduce((s,m,i)=> s + ((i<=CUR_MONTH && !m.pago && (Number(r.valorHabitual)||0)>0) ? 1 : 0), 0);
  return {pago, pendentes};
}
function accountName(id){ if(id==='despesas') return 'Despesas (salário)'; return (state.units.find(u=>u.id===id)||{}).nome || '—'; }
function despesasSaldoInfo(){
  const receitas = state.expenses.filter(e=>e.tipo==='Receita').reduce((s,e)=>s+(Number(e.valor)||0),0);
  const despesas = state.expenses.filter(e=>e.tipo==='Despesa').reduce((s,e)=>s+(Number(e.valor)||0),0);
  const transfersIn = state.transfers.filter(t=>t.destino==='despesas').reduce((s,t)=>s+(Number(t.valor)||0),0);
  const transfersOut = state.transfers.filter(t=>t.origem==='despesas').reduce((s,t)=>s+(Number(t.valor)||0),0);
  return {receitas, despesas, transfersIn, transfersOut, saldo: receitas - despesas + transfersIn - transfersOut};
}

function computePendencias(){
  const list = [];
  state.units.forEach(u=>{
    u.months.forEach((m,i)=>{
      if(i<=CUR_MONTH){
        if((Number(u.rendaMensal)||0)>0 && !m.recebida) list.push({type:'renda', kind:'unit', unitId:u.id, unitName:u.nome, label:`Renda de ${m.mes}`});
        if((Number(m.valorCondominio)||0)>0 && !m.condominioPago) list.push({type:'condominio', kind:'unit', unitId:u.id, unitName:u.nome, label:`Condomínio de ${m.mes}`});
      }
    });
    u.imi.forEach(r=>{
      if((Number(r.valor)||0)>0 && !r.pago) list.push({type:'imi', kind:'unit', unitId:u.id, unitName:u.nome, label:`IMI — ${r.label}`});
    });
  });
  state.reminders.forEach(r=>{
    r.months.forEach((m,i)=>{
      if(i<=CUR_MONTH && !m.pago && (Number(r.valorHabitual)||0)>0){
        list.push({type:'lembrete', kind:'reminder', unitId:r.id, unitName:r.nome, label:`${r.nome} de ${m.mes}`});
      }
    });
  });
  return list;
}

function setActiveNav(){
  document.querySelectorAll('nav.bottomnav button').forEach(b=> b.classList.toggle('active', b.dataset.view===view));
  const dot = document.getElementById('navDot');
  if(dot) dot.style.display = computePendencias().length>0 ? 'block':'none';
}

function goto(v, id){
  view = v;
  if(v==='unidadeDetail') currentUnitId = id;
  else if(v==='reminderDetail') currentReminderId = id;
  render(); window.scrollTo(0,0);
}
document.querySelectorAll('nav.bottomnav button').forEach(b=> b.addEventListener('click', ()=> goto(b.dataset.view)));

function render(){
  setActiveNav();
  const root = document.getElementById('view-root');
  const title = document.getElementById('pageTitle');
  const sub = document.getElementById('pageSub');
  if(view==='dashboard'){ title.textContent="Resumo"; sub.textContent="Visão geral de tudo"; root.innerHTML = renderDashboard(); }
  else if(view==='unidades'){ title.textContent="Unidades"; sub.textContent="Imóveis, vagas e transferências"; root.innerHTML = renderUnidades(); }
  else if(view==='unidadeDetail'){ const u=state.units.find(x=>x.id===currentUnitId); title.textContent=u?u.nome:"Unidade"; sub.textContent=u?u.tipo:""; root.innerHTML = renderUnidadeDetail(u); }
  else if(view==='lembretes'){ title.textContent="Lembretes"; sub.textContent="Água, luz, telecomunicações e outras contas"; root.innerHTML = renderLembretes(); }
  else if(view==='reminderDetail'){ const r=state.reminders.find(x=>x.id===currentReminderId); title.textContent=r?r.nome:"Lembrete"; sub.textContent=r?r.categoria:""; root.innerHTML = renderReminderDetail(r); }
  else if(view==='despesas'){ title.textContent="Despesas"; sub.textContent="Salário e gastos do dia a dia"; root.innerHTML = renderDespesas(); }
  else if(view==='ajuda'){ title.textContent="Ajuda"; sub.textContent="Backup, Excel e código de acesso"; root.innerHTML = renderAjuda(); }
  bindViewEvents();
}

function renderMonthlyChart(){
  const lineC = cssVar('--line') || '#E7E8EF';
  const successC = cssVar('--success') || '#0EA968';
  const inkSoftC = cssVar('--ink-soft') || '#6B7280';
  const esperado = new Array(12).fill(0), recebido = new Array(12).fill(0);
  state.units.forEach(u=> u.months.forEach((m,i)=>{ esperado[i]+=Number(u.rendaMensal)||0; if(m.recebida) recebido[i]+=Number(m.valor)||0; }));
  const max = Math.max(1, ...esperado, ...recebido);
  const w=300, h=110, slot=w/12;
  let bars='';
  for(let i=0;i<12;i++){
    const x=i*slot, hE=(esperado[i]/max)*h, hR=(recebido[i]/max)*h;
    bars += `<rect x="${x+1.5}" y="${h-hE}" width="${slot/2-2}" height="${hE}" fill="${lineC}"/>`;
    bars += `<rect x="${x+slot/2}" y="${h-hR}" width="${slot/2-2}" height="${hR}" fill="${successC}"/>`;
  }
  let ticks='';
  [0,3,6,9].forEach(i=> ticks += `<text x="${i*slot+2}" y="${h+11}" font-size="7.5" font-family="IBM Plex Mono, monospace" fill="${inkSoftC}">${MESES[i].slice(0,3)}</text>`);
  return `<svg viewBox="0 0 ${w} ${h+16}" style="width:100%;height:auto;display:block;">${bars}<line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="${lineC}" stroke-width="1"/>${ticks}</svg>
    <div class="chart-legend"><span><span class="sw" style="background:${lineC};"></span>Esperado</span><span><span class="sw" style="background:${successC};"></span>Recebido</span></div>`;
}
function renderCategoriaChart(){
  const primaryC = cssVar('--primary') || '#5B4FE9';
  const map = {};
  state.expenses.filter(e=>e.tipo==='Despesa').forEach(e=>{ map[e.categoria] = (map[e.categoria]||0) + (Number(e.valor)||0); });
  const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0) return '<div class="empty">Ainda sem despesas registadas.</div>';
  const max = Math.max(...entries.map(e=>e[1]));
  return entries.map(([cat,val])=>`
    <div style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;"><span>${escapeHtml(cat)}</span><span style="font-family:'IBM Plex Mono',monospace;">${fmt(val)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,Math.round((val/max)*100))}%;background:${primaryC};"></div></div>
    </div>`).join('');
}

  const data = e || {id:null, data:todayStr(), descricao:"", categoria:CATS[0], tipo:"Despesa", valor:0};
  return `
    <div class="card" id="txForm">
      <h3>${isNew? 'Nova transação':'Editar transação'}</h3>
      <div class="field"><label>Data</label><input type="date" id="tx_data" value="${data.data}"></div>
      <div class="field"><label>Descrição</label><input type="text" id="tx_desc" value="${escapeAttr(data.descricao)}"></div>
      <div class="field"><label>Categoria</label><select id="tx_cat">${CATS.map(c=>`<option value="${c}" ${data.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="field"><label>Tipo</label><select id="tx_tipo"><option value="Receita" ${data.tipo==='Receita'?'selected':''}>Receita</option><option value="Despesa" ${data.tipo==='Despesa'?'selected':''}>Despesa</option></select></div>
      <div class="field"><label>Valor (€)</label><input type="number" step="0.01" id="tx_valor" value="${data.valor}"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn block" id="txSaveBtn">Guardar</button>
        <button class="btn secondary block" id="txCancelBtn">Cancelar</button>
        ${!isNew? '<button class="btn danger block" id="txDeleteBtn">Eliminar</button>':''}
      </div>
    </div>`;
}

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function buildPrintGeral(){
  const totals = state.units.map(unitTotals);
  const recebidoTotal = totals.reduce((s,t)=>s+t.recebido,0);
  const esperadoTotal = totals.reduce((s,t)=>s+t.esperado,0);
  const d = despesasSaldoInfo();
  const unitRows = state.units.map(u=>{
    const t = unitTotals(u);
    return `<tr><td>${escapeHtml(u.nome)}</td><td>${u.tipo}</td><td>${fmt(u.rendaMensal)}</td><td>${fmt(t.recebido)}</td><td>${t.pct}%</td><td>${fmt(t.condo)}</td><td>${fmt(t.imiPago)}</td><td>${fmt(t.saldo)}</td></tr>`;
  }).join('');
  const remRows = state.reminders.map(r=>{
    const t = reminderTotals(r);
    return `<tr><td>${escapeHtml(r.nome)}</td><td>${r.categoria}</td><td>${fmt(r.valorHabitual)}</td><td>${fmt(t.pago)}</td><td>${t.pendentes}</td></tr>`;
  }).join('');
  const txRows = [...state.expenses].sort((a,b)=>(b.data||'').localeCompare(a.data||'')).slice(0,25)
    .map(e=>`<tr><td>${e.data||'—'}</td><td>${escapeHtml(e.descricao)}</td><td>${e.categoria}</td><td>${e.tipo}</td><td>${fmt(e.valor)}</td></tr>`).join('');
  return `
    <div class="printhead">Livro de Contas — Relatório Geral</div>
    <div class="printsub">Gerado em ${new Date().toLocaleDateString('pt-PT')}</div>
    <div class="printsection">Unidades</div>
    <table class="printtable"><thead><tr><th>Unidade</th><th>Tipo</th><th>Renda Mensal</th><th>Recebido</th><th>%</th><th>Condomínio</th><th>IMI Pago</th><th>Saldo</th></tr></thead><tbody>${unitRows}</tbody></table>
    <div class="printsection">Lembretes</div>
    <table class="printtable"><thead><tr><th>Nome</th><th>Categoria</th><th>Valor Habitual</th><th>Pago no ano</th><th>Meses em falta</th></tr></thead><tbody>${remRows}</tbody></table>
    <div class="printsection">Totais</div>
    <table class="printtable"><tbody>
      <tr><td>Recebido (rendas)</td><td>${fmt(recebidoTotal)}</td></tr>
      <tr><td>Esperado (rendas, ano)</td><td>${fmt(esperadoTotal)}</td></tr>
      <tr><td>Receitas (salário/despesas)</td><td>${fmt(d.receitas)}</td></tr>
      <tr><td>Despesas (salário/despesas)</td><td>${fmt(d.despesas)}</td></tr>
      <tr><td>Saldo Despesas (com transferências)</td><td>${fmt(d.saldo)}</td></tr>
    </tbody></table>
    <div class="printsection">Últimos movimentos (salário/despesas)</div>
    <table class="printtable"><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th></tr></thead><tbody>${txRows}</tbody></table>
  `;
}
function buildPrintUnit(u){
  const t = unitTotals(u);
  const monthRows = u.months.map(m=>`<tr><td>${m.mes}</td><td>${m.recebida?'Sim':'Não'}</td><td>${fmt(m.valor)}</td><td>${m.data||'—'}</td><td>${m.reciboEmitido}</td><td>${m.condominioPago?'Sim':'Não'}</td><td>${fmt(m.valorCondominio)}</td></tr>`).join('');
  const imiRows = u.imi.map(r=>`<tr><td>${r.label}</td><td>${fmt(r.valor)}</td><td>${r.pago?'Sim':'Não'}</td><td>${r.data||'—'}</td></tr>`).join('');
  return `
    <div class="printhead">${escapeHtml(u.nome)}</div>
    <div class="printsub">${u.tipo}${u.inquilino? ' · Inquilino: '+escapeHtml(u.inquilino):''} · Gerado em ${new Date().toLocaleDateString('pt-PT')}</div>
    <table class="printtable"><tbody>
      <tr><td>Renda mensal esperada</td><td>${fmt(u.rendaMensal)}</td></tr>
      <tr><td>Recibo necessário</td><td>${u.reciboNecessario?'Sim':'Não'}</td></tr>
      <tr><td>Total recebido no ano</td><td>${fmt(t.recebido)}</td></tr>
      <tr><td>Saldo disponível</td><td>${fmt(t.saldo)}</td></tr>
    </tbody></table>
    <div class="printsection">Mês a mês</div>
    <table class="printtable"><thead><tr><th>Mês</th><th>Recebida</th><th>Valor</th><th>Data</th><th>Recibo</th><th>Condo.</th><th>Valor Condo.</th></tr></thead><tbody>${monthRows}</tbody></table>
    <div class="printsection">IMI</div>
    <table class="printtable"><thead><tr><th>Prestação</th><th>Valor</th><th>Pago</th><th>Data</th></tr></thead><tbody>${imiRows}</tbody></table>
  `;
}
function doPrint(html){ document.getElementById('printArea').innerHTML = html; window.print(); }

function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = ()=>reject(new Error('falha ao carregar '+src));
    document.head.appendChild(s);
  });
}
async function exportExcel(){
  const statusEl = document.getElementById('excelStatus');
  const btn = document.getElementById('exportExcelBtn');
  try{
    if(statusEl) statusEl.textContent = 'A preparar...';
    if(btn) btn.disabled = true;
    if(!window.ExcelJS) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');

    const wb = new ExcelJS.Workbook();
    const NAVY = 'FF1B2A4A';
    const headerStyle = (cell)=>{ cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; cell.font = {bold:true,color:{argb:'FFFFFFFF'}}; };
    const titleStyle = (cell)=>{ cell.font = {bold:true,size:14,color:{argb:NAVY}}; };

    const dash = wb.addWorksheet('Dashboard');
    dash.columns = [{width:20},{width:12},{width:16},{width:16},{width:10},{width:14},{width:12},{width:14}];
    dash.getCell('A1').value = 'Dashboard — Resumo Geral'; titleStyle(dash.getCell('A1'));
    const dhead = ['Unidade','Tipo','Renda Mensal','Total Recebido','%','Condomínio Pago','IMI Pago','Saldo'];
    dhead.forEach((h,i)=>{ const c = dash.getCell(3, i+1); c.value = h; headerStyle(c); });
    state.units.forEach((u,idx)=>{
      const t = unitTotals(u);
      const row = 4+idx;
      dash.getCell(row,1).value = u.nome; dash.getCell(row,2).value = u.tipo;
      dash.getCell(row,3).value = Number(u.rendaMensal)||0; dash.getCell(row,4).value = t.recebido;
      dash.getCell(row,5).value = t.pct/100; dash.getCell(row,5).numFmt = '0%';
      dash.getCell(row,6).value = t.condo; dash.getCell(row,7).value = t.imiPago; dash.getCell(row,8).value = t.saldo;
      [3,4,6,7,8].forEach(c=> dash.getCell(row,c).numFmt = '#,##0.00 "€"');
    });

    state.units.forEach(u=>{
      const t = unitTotals(u);
      const ws = wb.addWorksheet(u.nome.slice(0,31).replace(/[\\\/\?\*\[\]:]/g,''));
      ws.columns = [{width:14},{width:12},{width:12},{width:12},{width:12},{width:10},{width:14},{width:20}];
      ws.getCell('A1').value = u.nome; titleStyle(ws.getCell('A1'));
      ws.getCell('A2').value = 'Tipo:'; ws.getCell('B2').value = u.tipo;
      ws.getCell('A3').value = 'Inquilino:'; ws.getCell('B3').value = u.inquilino;
      ws.getCell('A4').value = 'Renda Mensal (€):'; ws.getCell('B4').value = Number(u.rendaMensal)||0; ws.getCell('B4').numFmt = '#,##0.00 "€"';
      ws.getCell('A5').value = 'Recibo Necessário:'; ws.getCell('B5').value = u.reciboNecessario?'Sim':'Não';
      const mhead = ['Mês','Recebida','Valor (€)','Data','Recibo Emitido','Condomínio Pago','Valor Condomínio (€)','Obs.'];
      mhead.forEach((h,i)=>{ const c = ws.getCell(7,i+1); c.value = h; headerStyle(c); });
      u.months.forEach((m,i)=>{
        const row = 8+i;
        ws.getCell(row,1).value = m.mes; ws.getCell(row,2).value = m.recebida?'Sim':'Não';
        ws.getCell(row,3).value = Number(m.valor)||0; ws.getCell(row,3).numFmt = '#,##0.00 "€"';
        ws.getCell(row,4).value = m.data||''; ws.getCell(row,5).value = m.reciboEmitido;
        ws.getCell(row,6).value = m.condominioPago?'Sim':'Não';
        ws.getCell(row,7).value = Number(m.valorCondominio)||0; ws.getCell(row,7).numFmt = '#,##0.00 "€"';
        ws.getCell(row,8).value = m.obs||'';
      });
      const totRow = 20;
      ws.getCell(totRow,1).value = 'TOTAL'; ws.getCell(totRow,1).font = {bold:true};
      ws.getCell(totRow,3).value = t.recebido; ws.getCell(totRow,3).numFmt = '#,##0.00 "€"'; ws.getCell(totRow,3).font = {bold:true};
      ws.getCell(totRow,7).value = t.condo; ws.getCell(totRow,7).numFmt = '#,##0.00 "€"'; ws.getCell(totRow,7).font = {bold:true};
      ws.getCell(22,1).value = 'IMI'; ws.getCell(22,1).font = {bold:true,color:{argb:NAVY}};
      const ihead = ['Prestação','Valor (€)','Pago','Data'];
      ihead.forEach((h,i)=>{ const c = ws.getCell(23,i+1); c.value = h; headerStyle(c); });
      u.imi.forEach((r,i)=>{
        const row = 24+i;
        ws.getCell(row,1).value = r.label; ws.getCell(row,2).value = Number(r.valor)||0; ws.getCell(row,2).numFmt = '#,##0.00 "€"';
        ws.getCell(row,3).value = r.pago?'Sim':'Não'; ws.getCell(row,4).value = r.data||'';
      });
      ws.getCell(27,1).value = 'Saldo disponível'; ws.getCell(27,1).font = {bold:true};
      ws.getCell(27,2).value = t.saldo; ws.getCell(27,2).numFmt = '#,##0.00 "€"'; ws.getCell(27,2).font = {bold:true};
    });

    const rem = wb.addWorksheet('Lembretes');
    rem.columns = [{width:20},{width:16},{width:14},{width:10},{width:10},{width:12},{width:14}];
    const rhead = ['Lembrete','Categoria','Mês','Pago','Valor (€)','Data'];
    rhead.forEach((h,i)=>{ const c = rem.getCell(1,i+1); c.value = h; headerStyle(c); });
    let rrow = 2;
    state.reminders.forEach(r=>{
      r.months.forEach(m=>{
        rem.getCell(rrow,1).value = r.nome; rem.getCell(rrow,2).value = r.categoria; rem.getCell(rrow,3).value = m.mes;
        rem.getCell(rrow,4).value = m.pago?'Sim':'Não'; rem.getCell(rrow,5).value = Number(m.valor)||0; rem.getCell(rrow,5).numFmt = '#,##0.00 "€"';
        rem.getCell(rrow,6).value = m.data||''; rrow++;
      });
    });

    const desp = wb.addWorksheet('Despesas');
    desp.columns = [{width:12},{width:30},{width:16},{width:14},{width:12}];
    const dInfo = despesasSaldoInfo();
    desp.getCell('A1').value = 'Resumo'; titleStyle(desp.getCell('A1'));
    desp.getCell('A2').value = 'Total Receitas (€)'; desp.getCell('B2').value = dInfo.receitas; desp.getCell('B2').numFmt = '#,##0.00 "€"';
    desp.getCell('A3').value = 'Total Despesas (€)'; desp.getCell('B3').value = dInfo.despesas; desp.getCell('B3').numFmt = '#,##0.00 "€"';
    desp.getCell('A4').value = 'Transferências recebidas de unidades (€)'; desp.getCell('B4').value = dInfo.transfersIn; desp.getCell('B4').numFmt = '#,##0.00 "€"';
    desp.getCell('A5').value = 'Transferências enviadas p/ unidades (€)'; desp.getCell('B5').value = dInfo.transfersOut; desp.getCell('B5').numFmt = '#,##0.00 "€"';
    desp.getCell('A6').value = 'Saldo Final (€)'; desp.getCell('B6').value = dInfo.saldo; desp.getCell('B6').numFmt = '#,##0.00 "€"'; desp.getCell('A6').font = {bold:true}; desp.getCell('B6').font = {bold:true};
    const ehead = ['Data','Descrição','Categoria','Tipo','Valor (€)'];
    ehead.forEach((h,i)=>{ const c = desp.getCell(8,i+1); c.value = h; headerStyle(c); });
    [...state.expenses].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).forEach((e,i)=>{
      const row = 9+i;
      desp.getCell(row,1).value = e.data||''; desp.getCell(row,2).value = e.descricao||'';
      desp.getCell(row,3).value = e.categoria; desp.getCell(row,4).value = e.tipo;
      desp.getCell(row,5).value = Number(e.valor)||0; desp.getCell(row,5).numFmt = '#,##0.00 "€"';
    });

    if(state.transfers.length){
      const trs = wb.addWorksheet('Transferências');
      trs.columns = [{width:12},{width:22},{width:22},{width:14},{width:26}];
      const thead = ['Data','De','Para','Valor (€)','Descrição'];
      thead.forEach((h,i)=>{ const c = trs.getCell(1,i+1); c.value = h; headerStyle(c); });
      state.transfers.forEach((t,i)=>{
        const row = 2+i;
        trs.getCell(row,1).value = t.data||''; trs.getCell(row,2).value = accountName(t.origem);
        trs.getCell(row,3).value = accountName(t.destino); trs.getCell(row,4).value = Number(t.valor)||0; trs.getCell(row,4).numFmt = '#,##0.00 "€"';
        trs.getCell(row,5).value = t.descricao||'';
      });
    }

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'Livro-de-Contas.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    if(statusEl) statusEl.textContent = 'Ficheiro Excel gerado.';
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.textContent = 'Não foi possível gerar o Excel (verifique a ligação à internet).';
  }finally{
    if(btn) btn.disabled = false;
  }
}

function bindViewEvents(){
  document.querySelectorAll('[data-open-unit]').forEach(el=>{
    el.addEventListener('click', (ev)=>{ if(ev.target.closest('[data-quick-toggle]')) return; goto('unidadeDetail', el.dataset.openUnit); });
  });
  document.querySelectorAll('[data-open-reminder]').forEach(el=>{
    el.addEventListener('click', (ev)=>{ if(ev.target.closest('[data-quick-toggle-reminder]')) return; goto('reminderDetail', el.dataset.openReminder); });
  });
  document.querySelectorAll('[data-quick-toggle]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const u = state.units.find(x=>x.id===el.dataset.quickToggle);
      if(!u) return;
      const m = u.months[CUR_MONTH];
      m.recebida = !m.recebida;
      if(m.recebida){ if(!m.valor) m.valor = Number(u.rendaMensal)||0; if(!m.data) m.data = todayStr(); }
      persist(); render();
    });
  });
  document.querySelectorAll('[data-quick-toggle-reminder]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      ev.stopPropagation();
      const r = state.reminders.find(x=>x.id===el.dataset.quickToggleReminder);
      if(!r) return;
      const m = r.months[CUR_MONTH];
      m.pago = !m.pago;
      if(m.pago){ if(!m.valor) m.valor = Number(r.valorHabitual)||0; if(!m.data) m.data = todayStr(); }
      persist(); render();
    });
  });

  const addUnitBtn = document.getElementById('addUnitBtn');
  if(addUnitBtn) addUnitBtn.addEventListener('click', ()=>{ state.units.push(seedUnit(state.units.length+1)); persist(); render(); });

  const backBtn = document.getElementById('backToUnits');
  if(backBtn) backBtn.addEventListener('click', ()=> goto('unidades'));
  const backLembretesBtn = document.getElementById('backToLembretes');
  if(backLembretesBtn) backLembretesBtn.addEventListener('click', ()=> goto('lembretes'));

  const delUnitBtn = document.getElementById('deleteUnitBtn');
  if(delUnitBtn) delUnitBtn.addEventListener('click', ()=>{
    if(confirm('Eliminar esta unidade? Esta ação não pode ser desfeita.')){
      state.units = state.units.filter(u=>u.id!==currentUnitId);
      state.transfers = state.transfers.filter(t=>t.origem!==currentUnitId && t.destino!==currentUnitId);
      persist(); goto('unidades');
    }
  });

  const fillRendaBtn = document.getElementById('fillRendaBtn');
  if(fillRendaBtn) fillRendaBtn.addEventListener('click', ()=>{
    const u = state.units.find(x=>x.id===currentUnitId); if(!u) return;
    u.months.forEach(m=>{ if(!m.valor) m.valor = Number(u.rendaMensal)||0; });
    persist(); render();
  });
  const fillCondoBtn = document.getElementById('fillCondoBtn');
  if(fillCondoBtn) fillCondoBtn.addEventListener('click', ()=>{
    const u = state.units.find(x=>x.id===currentUnitId); if(!u) return;
    const ref = u.months.find(m=>Number(m.valorCondominio)>0);
    if(ref){ u.months.forEach(m=>{ if(!m.valorCondominio) m.valorCondominio = ref.valorCondominio; }); }
    persist(); render();
  });
  const fillReminderBtn = document.getElementById('fillReminderBtn');
  if(fillReminderBtn) fillReminderBtn.addEventListener('click', ()=>{
    const r = state.reminders.find(x=>x.id===currentReminderId); if(!r) return;
    r.months.forEach(m=>{ if(!m.valor) m.valor = Number(r.valorHabitual)||0; });
    persist(); render();
  });

  ['f_nome','f_tipo','f_inquilino','f_renda','f_recibo'].forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    el.addEventListener('change', ()=>{
      const u = state.units.find(x=>x.id===currentUnitId); if(!u) return;
      if(id==='f_nome') u.nome = el.value;
      if(id==='f_tipo') u.tipo = el.value;
      if(id==='f_inquilino') u.inquilino = el.value;
      if(id==='f_renda') u.rendaMensal = Number(el.value)||0;
      if(id==='f_recibo') u.reciboNecessario = el.value==='true';
      persist(); render();
    });
  });
  ['rmf_nome','rmf_categoria','rmf_valor'].forEach(id=>{
    const el = document.getElementById(id); if(!el) return;
    el.addEventListener('change', ()=>{
      const r = state.reminders.find(x=>x.id===currentReminderId); if(!r) return;
      if(id==='rmf_nome') r.nome = el.value;
      if(id==='rmf_categoria') r.categoria = el.value;
      if(id==='rmf_valor') r.valorHabitual = Number(el.value)||0;
      persist(); render();
    });
  });

  document.querySelectorAll('.fld').forEach(el=>{
    el.addEventListener('change', ()=>{
      const u = state.units.find(x=>x.id===currentUnitId); if(!u) return;
      const i = Number(el.dataset.m), f = el.dataset.f; let v = el.value;
      if(f==='recebida'){
        v = (v==='true'); u.months[i].recebida = v;
        if(v){ if(!u.months[i].valor) u.months[i].valor = Number(u.rendaMensal)||0; if(!u.months[i].data) u.months[i].data = todayStr(); }
      } else if(f==='condominioPago'){
        v = (v==='true'); u.months[i].condominioPago = v;
        if(v && !u.months[i].valorCondominio){ for(let k=i-1;k>=0;k--){ if(Number(u.months[k].valorCondominio)>0){ u.months[i].valorCondominio = u.months[k].valorCondominio; break; } } }
      } else if(f==='valor' || f==='valorCondominio'){ u.months[i][f] = Number(v)||0; }
      else{ u.months[i][f] = v; }
      persist(); render();
    });
  });
  document.querySelectorAll('.rmfld').forEach(el=>{
    el.addEventListener('change', ()=>{
      const r = state.reminders.find(x=>x.id===currentReminderId); if(!r) return;
      const i = Number(el.dataset.rm), f = el.dataset.f; let v = el.value;
      if(f==='pago'){
        v = (v==='true'); r.months[i].pago = v;
        if(v){ if(!r.months[i].valor) r.months[i].valor = Number(r.valorHabitual)||0; if(!r.months[i].data) r.months[i].data = todayStr(); }
      } else if(f==='valor'){ r.months[i].valor = Number(v)||0; }
      else{ r.months[i][f] = v; }
      persist(); render();
    });
  });
  document.querySelectorAll('.ifld').forEach(el=>{
    el.addEventListener('change', ()=>{
      const u = state.units.find(x=>x.id===currentUnitId); if(!u) return;
      const i = Number(el.dataset.imi), f = el.dataset.f; let v = el.value;
      if(f==='pago') v = (v==='true'); if(f==='valor') v = Number(v)||0;
      u.imi[i][f] = v; persist(); render();
    });
  });

  const addTxBtn = document.getElementById('addTxBtn');
  if(addTxBtn) addTxBtn.addEventListener('click', ()=>{
    editingTx = null; document.getElementById('txFormHolder').innerHTML = txForm(null);
    bindTxFormEvents(); document.getElementById('txForm').scrollIntoView({behavior:'smooth'});
  });
  document.querySelectorAll('[data-edit-transfer-from-despesas]').forEach(el=>{ el.addEventListener('click', ()=> goto('unidades')); });
  document.querySelectorAll('[data-edit-tx]').forEach(el=>{
    el.addEventListener('click', ()=>{
      editingTx = state.expenses.find(e=>e.id===el.dataset.editTx);
      document.getElementById('txFormHolder').innerHTML = txForm(editingTx);
      bindTxFormEvents(); document.getElementById('txForm').scrollIntoView({behavior:'smooth'});
    });
  });

  const addTransferBtn = document.getElementById('addTransferBtn');
  if(addTransferBtn) addTransferBtn.addEventListener('click', ()=>{
    editingTransfer = null; document.getElementById('transferFormHolder').innerHTML = transferForm(null);
    bindTransferFormEvents(); document.getElementById('transferForm').scrollIntoView({behavior:'smooth'});
  });
  document.querySelectorAll('[data-edit-transfer]').forEach(el=>{
    el.addEventListener('click', ()=>{
      editingTransfer = state.transfers.find(t=>t.id===el.dataset.editTransfer);
      document.getElementById('transferFormHolder').innerHTML = transferForm(editingTransfer);
      bindTransferFormEvents(); document.getElementById('transferForm').scrollIntoView({behavior:'smooth'});
    });
  });

  const addReminderBtn = document.getElementById('addReminderBtn');
  if(addReminderBtn) addReminderBtn.addEventListener('click', ()=>{
    editingReminder = null; document.getElementById('reminderFormHolder').innerHTML = reminderForm(null);
    bindReminderFormEvents(); document.getElementById('reminderForm').scrollIntoView({behavior:'smooth'});
  });
  const deleteReminderBtn = document.getElementById('deleteReminderBtn');
  if(deleteReminderBtn) deleteReminderBtn.addEventListener('click', ()=>{
    if(confirm('Eliminar este lembrete?')){
      state.reminders = state.reminders.filter(r=>r.id!==currentReminderId);
      persist(); goto('lembretes');
    }
  });

  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'livro-de-contas-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  });
  const importBtn = document.getElementById('importBtn');
  const importFile = document.getElementById('importFile');
  if(importBtn) importBtn.addEventListener('click', ()=> importFile.click());
  if(importFile) importFile.addEventListener('change', ()=>{
    const file = importFile.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed.units || !parsed.expenses){ alert('Ficheiro inválido: não parece ser uma cópia de segurança desta app.'); return; }
        if(!parsed.transfers) parsed.transfers = [];
        if(!parsed.reminders) parsed.reminders = seedReminders();
        if(confirm('Isto substitui TODOS os dados atuais pelos do ficheiro. Continuar?')){ state = parsed; persist(); goto('dashboard'); }
      }catch(e){ alert('Não foi possível ler este ficheiro. Verifique se é um .json exportado por esta app.'); }
      importFile.value = '';
    };
    reader.readAsText(file);
  });

  const exportExcelBtn = document.getElementById('exportExcelBtn');
  if(exportExcelBtn) exportExcelBtn.addEventListener('click', exportExcel);

  const printGeralBtn = document.getElementById('printGeralBtn');
  if(printGeralBtn) printGeralBtn.addEventListener('click', ()=> doPrint(buildPrintGeral()));
  const printUnitBtn = document.getElementById('printUnitBtn');
  if(printUnitBtn) printUnitBtn.addEventListener('click', ()=>{
    const u = state.units.find(x=>x.id===currentUnitId); if(u) doPrint(buildPrintUnit(u));
  });

  const setPinBtn = document.getElementById('setPinBtn');
  if(setPinBtn) setPinBtn.addEventListener('click', ()=>{
    const p1 = document.getElementById('newPin1').value.trim();
    const p2 = document.getElementById('newPin2').value.trim();
    const msg = document.getElementById('pinMsg');
    if(p1.length<4 || p1.length>6 || !/^\d+$/.test(p1)){ msg.textContent = 'O código deve ter 4 a 6 dígitos.'; return; }
    if(p1!==p2){ msg.textContent = 'Os códigos não coincidem.'; return; }
    localStorage.setItem('financas-pin', simpleHash(p1));
    msg.textContent = ''; render();
  });
  const removePinBtn = document.getElementById('removePinBtn');
  if(removePinBtn) removePinBtn.addEventListener('click', ()=>{
    if(confirm('Remover o código de acesso?')){ localStorage.removeItem('financas-pin'); render(); }
  });
  const changePinBtn = document.getElementById('changePinBtn');
  if(changePinBtn) changePinBtn.addEventListener('click', ()=>{
    if(confirm('Remover o código atual para definir um novo?')){ localStorage.removeItem('financas-pin'); render(); }
  });

  const themeToggle = document.getElementById('themeToggle');
  if(themeToggle && !themeToggle.dataset.bound){
    themeToggle.dataset.bound = '1';
    themeToggle.addEventListener('click', ()=>{
      const cur = document.documentElement.getAttribute('data-theme');
      applyTheme(cur==='dark' ? 'light' : 'dark');
      render();
    });
  }
}

function bindTxFormEvents(){
  document.getElementById('txCancelBtn').addEventListener('click', ()=>{ document.getElementById('txFormHolder').innerHTML = ''; });
  document.getElementById('txSaveBtn').addEventListener('click', ()=>{
    const payload = {
      data: document.getElementById('tx_data').value, descricao: document.getElementById('tx_desc').value,
      categoria: document.getElementById('tx_cat').value, tipo: document.getElementById('tx_tipo').value,
      valor: Number(document.getElementById('tx_valor').value)||0
    };
    if(editingTx){ Object.assign(editingTx, payload); } else { state.expenses.push({id:uid(), ...payload}); }
    persist(); editingTx = null; render();
  });
  const delBtn = document.getElementById('txDeleteBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(confirm('Eliminar este movimento?')){ state.expenses = state.expenses.filter(e=>e.id!==editingTx.id); persist(); editingTx = null; render(); }
  });
}
function bindTransferFormEvents(){
  document.getElementById('trCancelBtn').addEventListener('click', ()=>{ document.getElementById('transferFormHolder').innerHTML = ''; });
  document.getElementById('trSaveBtn').addEventListener('click', ()=>{
    const origem = document.getElementById('tr_origem').value;
    const destino = document.getElementById('tr_destino').value;
    if(origem===destino){ alert('Origem e destino têm de ser diferentes.'); return; }
    const payload = {
      data: document.getElementById('tr_data').value, origem, destino,
      valor: Number(document.getElementById('tr_valor').value)||0,
      descricao: document.getElementById('tr_desc').value
    };
    if(editingTransfer){ Object.assign(editingTransfer, payload); } else { state.transfers.push({id:uid(), ...payload}); }
    persist(); editingTransfer = null; render();
  });
  const delBtn = document.getElementById('trDeleteBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    if(confirm('Eliminar esta transferência?')){ state.transfers = state.transfers.filter(t=>t.id!==editingTransfer.id); persist(); editingTransfer = null; render(); }
  });
}
function bindReminderFormEvents(){
  document.getElementById('rmCancelBtn').addEventListener('click', ()=>{ document.getElementById('reminderFormHolder').innerHTML = ''; });
  document.getElementById('rmSaveBtn').addEventListener('click', ()=>{
    const payload = {
      nome: document.getElementById('rm_nome').value || 'Lembrete',
      categoria: document.getElementById('rm_categoria').value,
      valorHabitual: Number(document.getElementById('rm_valor').value)||0
    };
    if(editingReminder){ Object.assign(editingReminder, payload); }
    else{ state.reminders.push({id:uid(), months: MESES.map(m=>({mes:m,pago:false,valor:0,data:""})), ...payload}); }
    persist(); editingReminder = null; render();
  });
}

function showLockScreen(){
  const lock = document.createElement('div');
  lock.id = 'lockScreen';
  lock.innerHTML = `
    <div class="box">
      <h1>Livro de Contas</h1>
      <p>Introduza o código de acesso</p>
      <input type="password" inputmode="numeric" id="pinInput" maxlength="6" autofocus>
      <div class="err" id="pinErr"></div>
      <button class="btn gold block" id="unlockBtn">Entrar</button>
    </div>`;
  document.body.appendChild(lock);
  document.getElementById('app').style.display = 'none';
  const tryUnlock = ()=>{
    const val = document.getElementById('pinInput').value.trim();
    const stored = localStorage.getItem('financas-pin');
    if(simpleHash(val)===stored){ lock.remove(); document.getElementById('app').style.display = 'flex'; }
    else{ document.getElementById('pinErr').textContent = 'Código incorreto.'; document.getElementById('pinInput').value = ''; }
  };
  document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
  document.getElementById('pinInput').addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') tryUnlock(); });
}

initTheme();
(async function init(){
  await loadState();
  render();
  if(localStorage.getItem('financas-pin')) showLockScreen();
})();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(err=> console.error('Falha ao registar service worker:', err));
  });
}
</script>
</body>
</html>
