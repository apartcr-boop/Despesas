<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Livro de Contas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#5B4FE9">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#F3F4F8; --card:#FFFFFF; --chip:#F1F1F8;
    --ink:#14161F; --ink-soft:#6B7280; --line:#E7E8EF;
    --primary:#5B4FE9; --primary-ink:#FFFFFF; --primary-soft:#ECEAFD;
    --success:#0EA968; --success-soft:#E3F7EE;
    --danger:#E23F5E; --danger-soft:#FCE7EB;
    --warn:#DB8A11; --warn-soft:#FBF0DC;
    --shadow:0 1px 2px rgba(20,22,31,0.04), 0 6px 16px rgba(20,22,31,0.06);
    --radius:18px; --radius-sm:12px;
  }
  [data-theme="dark"]{
    --bg:#0E0F16; --card:#1A1C27; --chip:#242631;
    --ink:#EEEFF5; --ink-soft:#98A0B3; --line:#2B2E3B;
    --primary:#8C82FF; --primary-ink:#12131C; --primary-soft:rgba(140,130,255,0.16);
    --success:#3FDB94; --success-soft:rgba(63,219,148,0.14);
    --danger:#FF7288; --danger-soft:rgba(255,114,136,0.14);
    --warn:#F5B441; --warn-soft:rgba(245,180,65,0.14);
    --shadow:0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.28);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:80px;}
  header.top{padding:20px 18px 14px;background:var(--bg);position:sticky;top:0;z-index:5;}
  .headrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
  header.top .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);margin:0 0 4px;font-weight:600;}
  header.top h1{font-weight:800;font-size:24px;margin:0;letter-spacing:-0.02em;color:var(--ink);}
  header.top .sub{font-size:13px;color:var(--ink-soft);margin-top:5px;}
  .theme-toggle{background:var(--chip);border:1px solid var(--line);border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .theme-toggle svg{width:18px;height:18px;stroke:var(--ink);fill:none;}
  main{flex:1;padding:14px 16px 8px;}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card h2{font-size:16px;margin:0 0 10px;font-weight:700;letter-spacing:-0.01em;}
  .card h3{font-size:14.5px;margin:0 0 8px;font-weight:700;letter-spacing:-0.01em;}
  .stat-row{display:flex;gap:10px;margin-bottom:12px;}
  .stat{flex:1;background:var(--chip);border-radius:var(--radius-sm);padding:11px 13px;}
  .stat.clickable{cursor:pointer;}
  .stat .label{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
  .stat .value{font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;margin-top:3px;color:var(--ink);}
  .stat.pos .value{color:var(--success);} .stat.neg .value{color:var(--danger);}
  .bar-track{height:8px;border-radius:5px;background:var(--chip);overflow:hidden;}
  .bar-fill{height:100%;background:var(--success);}
  .unit-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer;}
  .unit-row:first-child{border-top:none;}
  .unit-name{font-weight:600;font-size:14px;}
  .unit-meta{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .unit-pct{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
  .pill{font-family:'IBM Plex Mono',monospace;font-size:10.5px;font-weight:600;letter-spacing:.02em;padding:6px 10px;border-radius:20px;border:1px solid var(--line);background:var(--chip);color:var(--ink-soft);white-space:nowrap;cursor:pointer;}
  .pill.on{background:var(--success-soft);border-color:var(--success);color:var(--success);}
  .chip-status{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:7px;display:inline-block;}
  .chip-status.pago{background:var(--success-soft);color:var(--success);}
  .chip-status.parcial{background:var(--warn-soft);color:var(--warn);}
  .chip-status.previsto{background:var(--chip);color:var(--ink-soft);border:1px solid var(--line);}
  .chip-status.vencido{background:var(--danger-soft);color:var(--danger);}
  .chip-status.anulado{background:var(--chip);color:var(--ink-soft);text-decoration:line-through;}
  .chip-status.ocupada{background:var(--success-soft);color:var(--success);}
  .chip-status.vaga{background:var(--chip);color:var(--ink-soft);border:1px solid var(--line);}
  .chip-status.reservada{background:var(--primary-soft);color:var(--primary);}
  .chip-status.manutencao{background:var(--warn-soft);color:var(--warn);}
  .chip-tipo{font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:3px 7px;border-radius:6px;background:var(--chip);color:var(--ink-soft);}
  .chip-tipo.transferencia{background:var(--primary-soft);color:var(--primary);}
  .chip-tipo.caucao{background:var(--warn-soft);color:var(--warn);}
  button.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border-radius:var(--radius-sm);border:none;background:var(--ink);color:var(--bg);padding:11px 16px;cursor:pointer;}
  button.btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--line);}
  button.btn.gold{background:var(--primary);color:var(--primary-ink);}
  button.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
  button.btn.small{padding:7px 12px;font-size:12.5px;border-radius:10px;}
  button.btn.block{width:100%;}
  button.btn:active{opacity:.8;}
  button.btn:disabled{opacity:.4;cursor:default;}
  .quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:5px;font-weight:600;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field input[type=password],.field select,.field textarea{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);}
  .field input:focus,.field select:focus{outline:2px solid var(--primary);outline-offset:1px;}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .filterbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;}
  .filterchip{font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--chip);color:var(--ink-soft);white-space:nowrap;cursor:pointer;flex-shrink:0;}
  .filterchip.active{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);}
  .mv-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer;}
  .mv-row:first-child{border-top:none;}
  .mv-left{min-width:0;}
  .mv-desc{font-size:13.5px;font-weight:600;}
  .mv-meta{font-size:11px;color:var(--ink-soft);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .mv-right{text-align:right;flex-shrink:0;}
  .mv-val{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:14px;}
  .mv-val.pos{color:var(--success);} .mv-val.neg{color:var(--danger);} .mv-val.neutral{color:var(--ink-soft);}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.data th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.data td{padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
  .table-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px;}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft);font-size:13px;text-decoration:none;margin-bottom:12px;cursor:pointer;background:none;border:none;padding:0;font-family:'Inter',sans-serif;font-weight:600;}
  nav.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;max-width:520px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);}
  nav.bottomnav button{flex:1;padding:10px 2px 9px;background:none;border:none;font-family:'Inter',sans-serif;font-size:10.5px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;font-weight:500;}
  nav.bottomnav button svg{width:19px;height:19px;stroke:var(--ink-soft);fill:none;}
  nav.bottomnav button.active{color:var(--primary);} nav.bottomnav button.active svg{stroke:var(--primary);}
  .navdot{position:absolute;top:5px;right:26%;width:8px;height:8px;border-radius:50%;background:var(--danger);border:1.5px solid var(--card);display:none;}
  .empty{text-align:center;color:var(--ink-soft);font-size:13px;padding:22px 8px;}
  .helpbox{font-size:13px;line-height:1.6;color:var(--ink-soft);}
  .helpbox strong{color:var(--ink);}
  .alert-item{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line);cursor:pointer;}
  .alert-item:first-child{border-top:none;}
  .alert-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .alert-dot.vencida{background:var(--danger);} .alert-dot.esteMes{background:var(--warn);} .alert-dot.proxima{background:var(--primary);}
  .alert-label{font-size:13px;font-weight:600;}
  .alert-unit{font-size:11.5px;color:var(--ink-soft);}
  .chart-legend{display:flex;gap:14px;font-size:11px;color:var(--ink-soft);margin-top:6px;}
  .chart-legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;}
  .row-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .warn-box{background:var(--danger-soft);border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;margin-top:10px;}
  .group-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:14px 0 4px;}
  .group-label:first-child{margin-top:0;}
  #lockScreen{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;}
  #lockScreen .box{max-width:340px;width:100%;text-align:center;}
  #lockScreen h1{font-size:21px;margin-bottom:4px;font-weight:800;}
  #lockScreen p{font-size:13px;color:var(--ink-soft);margin-bottom:18px;}
  #lockScreen input{width:100%;text-align:center;font-size:22px;letter-spacing:.3em;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:12px;font-family:'IBM Plex Mono',monospace;color:var(--ink);}
  #lockScreen .err{color:var(--danger);font-size:12.5px;min-height:18px;margin-bottom:8px;}
  #printArea{display:none;}
  @media print{
    #app{display:none !important;} #lockScreen{display:none !important;}
    #printArea{display:block !important;background:#fff;color:#000;padding:0;}
  }
  .printhead{font-weight:800;font-size:20px;margin-bottom:2px;}
  .printsub{font-size:11px;color:#5A6B85;margin-bottom:16px;}
  .printsection{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#5B4FE9;margin:18px 0 6px;}
  table.printtable{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px;}
  table.printtable th{background:#14161F;color:#fff;text-align:left;padding:5px 6px;}
  table.printtable td{padding:4px 6px;border-bottom:1px solid #E7E8EF;}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="headrow">
      <div><p class="eyebrow">Livro de Contas</p><h1 id="pageTitle">Resumo</h1></div>
      <div style="display:flex;gap:8px;">
        <button class="theme-toggle" id="searchToggle" aria-label="Pesquisar">
          <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button class="theme-toggle" id="themeToggle" aria-label="Alternar tema">
          <svg id="themeIcon" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
      </div>
    </div>
    <p class="sub" id="pageSub">Imóveis, vagas e despesas do dia a dia</p>
  </header>
  <main id="view-root"></main>
  <nav class="bottomnav">
    <button data-view="dashboard">
      <span class="navdot" id="navDot"></span>
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
      Resumo
    </button>
    <button data-view="unidades">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-8h6v8"/></svg>
      Unidades
    </button>
    <button data-view="lembretes">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      Lembretes
    </button>
    <button data-view="despesas">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
      Despesas
    </button>
    <button data-view="ajuda">
      <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .3c0 1.7-2.3 1.8-2.3 3.7M12 17h.01"/></svg>
      Ajuda
    </button>
  </nav>
</div>
<div id="printArea"></div>

<script>
const CATEGORIAS = ["Renda","Condomínio","IMI","Salário","Gratificação","Alimentação","Transporte","Saúde","Casa","Manutenção","Lazer","Educação","Água","Eletricidade","Gás","Telecomunicações","Seguro","Outros"];
const TIPOS = [
  {v:'receita', l:'Receita'}, {v:'despesa', l:'Despesa'}, {v:'transferencia', l:'Transferência'},
  {v:'ajuste', l:'Ajuste'}, {v:'caucao', l:'Caução'}, {v:'reembolso', l:'Reembolso'}
];
const ESTADOS = [
  {v:'previsto', l:'Previsto'}, {v:'pago', l:'Pago'}, {v:'parcial', l:'Parcial'},
  {v:'vencido', l:'Vencido'}, {v:'anulado', l:'Anulado'}
];
const MEIOS_PAGAMENTO = ["Transferência Bancária","Dinheiro","Cartão","MB Way","Outro"];
const ESTADOS_UNIDADE = [
  {v:'ocupada', l:'Ocupada'}, {v:'vaga', l:'Vaga'}, {v:'reservada', l:'Reservada'}, {v:'manutencao', l:'Em manutenção'}
];
const FREQUENCIAS = [
  {v:'mensal', l:'Mensal'}, {v:'trimestral', l:'Trimestral'}, {v:'semestral', l:'Semestral'}, {v:'anual', l:'Anual'}
];

function uid(){ return Math.random().toString(36).slice(2,10); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function simpleHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=((h<<5)-h)+str.charCodeAt(i); h|=0; } return String(h); }
function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function safeCalc(expr){
  if(typeof expr !== 'string') return null;
  const trimmed = expr.trim();
  if(!trimmed) return null;
  if(!/^[0-9+\-*/(). ]+$/.test(trimmed)) return null;
  try{
    const val = Function('"use strict"; return ('+trimmed+')')();
    return (typeof val === 'number' && isFinite(val)) ? val : null;
  }catch(e){ return null; }
}
function resolveValueInput(id){
  const el = document.getElementById(id); if(!el) return 0;
  const raw = el.value;
  if(/[+\-*/]/.test(raw) && !/^-?[0-9.]+$/.test(raw)){
    const v = safeCalc(raw);
    return v!==null ? v : 0;
  }
  return Number(raw)||0;
}
function attachCalc(id){
  const el = document.getElementById(id); if(!el) return;
  el.addEventListener('blur', ()=>{
    const raw = el.value;
    if(/[+\-*/]/.test(raw) && !/^-?[0-9.]+$/.test(raw)){
      const v = safeCalc(raw);
      if(v!==null) el.value = v.toFixed(2);
    }
  });
}
function cashOnHand(){
  return state.movements.reduce((s,m)=>{
    if((m.meioPagamento||'Não especificado') !== 'Dinheiro') return s;
    if(m.tipo==='transferencia') return s;
    const val = realizedValue(m);
    if(m.tipo==='receita'||m.tipo==='reembolso') return s+val;
    if(m.tipo==='despesa') return s-val;
    if(m.tipo==='ajuste') return s+val;
    return s;
  },0);
}

// ---------- theme ----------
const MOON_PATH = '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>';
const SUN_PATH = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('financas-theme', t);
  const icon = document.getElementById('themeIcon');
  if(icon) icon.innerHTML = t==='dark' ? SUN_PATH : MOON_PATH;
}
function initTheme(){
  const saved = localStorage.getItem('financas-theme');
  const theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(theme);
}

// ---------- seed (novas instalações) ----------
function seedUnit(i){
  return { id: uid(), nome: "Unidade "+i, tipo: "Imóvel", estado:"ocupada", inquilino: "", rendaMensal: 0, reciboNecessario: true,
    valorAquisicao:0, dataAquisicao:'', valorAtualEstimado:0, dividaAssociada:0 };
}
function seedState(){
  return { version:2, units: [1,2,3,4,5].map(seedUnit), movements: [], recurrences: [], contasFinanceiras: [] };
}

// ---------- migração v1 -> v2 ----------
function migrateV1toV2(old){
  const CUR_YEAR = new Date().getFullYear();
  const units = [], movements = [], recurrences = [];
  (old.units||[]).forEach(u=>{
    const newUnit = { id:u.id, nome:u.nome, tipo:u.tipo, estado:'ocupada', inquilino:u.inquilino||'',
      rendaMensal:Number(u.rendaMensal)||0, reciboNecessario:!!u.reciboNecessario,
      valorAquisicao:0, dataAquisicao:'', valorAtualEstimado:0, dividaAssociada:0 };
    units.push(newUnit);
    (u.months||[]).forEach((m,i)=>{
      const dataStr = m.data || `${CUR_YEAR}-${String(i+1).padStart(2,'0')}-01`;
      const pk = `${CUR_YEAR}-${String(i+1).padStart(2,'0')}`;
      if(m.recebida || Number(m.valor)>0){
        movements.push({id:uid(), tipo:'receita', estado:m.recebida?'pago':'previsto', data:dataStr,
          dataPagamento:m.recebida?dataStr:'', valor:Number(m.valor)||0, valorPago:m.recebida?Number(m.valor)||0:0,
          categoria:'Renda', subcategoria:'', unitId:newUnit.id, origem:null, destino:null,
          entidade:u.inquilino||'', notas:'', referencia:'', anexo:'', reciboEmitido:m.reciboEmitido||'N/A',
          recurrenceId:null, periodKey:pk, criadoEm:todayStr()});
      }
      if(m.condominioPago || Number(m.valorCondominio)>0){
        movements.push({id:uid(), tipo:'despesa', estado:m.condominioPago?'pago':'previsto', data:dataStr,
          dataPagamento:m.condominioPago?dataStr:'', valor:Number(m.valorCondominio)||0, valorPago:m.condominioPago?Number(m.valorCondominio)||0:0,
          categoria:'Condomínio', subcategoria:'', unitId:newUnit.id, origem:null, destino:null,
          entidade:'', notas:m.obs||'', referencia:'', anexo:'', reciboEmitido:'N/A',
          recurrenceId:null, periodKey:pk, criadoEm:todayStr()});
      }
    });
    (u.imi||[]).forEach(r=>{
      if(Number(r.valor)>0){
        movements.push({id:uid(), tipo:'despesa', estado:r.pago?'pago':'previsto', data:r.data||`${CUR_YEAR}-01-01`,
          dataPagamento:r.pago?(r.data||`${CUR_YEAR}-01-01`):'', valor:Number(r.valor)||0, valorPago:r.pago?Number(r.valor)||0:0,
          categoria:'IMI', subcategoria:r.label, unitId:newUnit.id, origem:null, destino:null,
          entidade:'', notas:'', referencia:'', anexo:'', reciboEmitido:'N/A', recurrenceId:null, periodKey:null, criadoEm:todayStr()});
      }
    });
  });
  (old.expenses||[]).forEach(e=>{
    movements.push({id:uid(), tipo:e.tipo==='Receita'?'receita':'despesa', estado:'pago', data:e.data||`${CUR_YEAR}-01-01`,
      dataPagamento:e.data||`${CUR_YEAR}-01-01`, valor:Number(e.valor)||0, valorPago:Number(e.valor)||0,
      categoria:e.categoria, subcategoria:'', unitId:null, origem:null, destino:null,
      entidade:'', notas:e.descricao||'', referencia:'', anexo:'', reciboEmitido:'N/A', recurrenceId:null, periodKey:null, criadoEm:todayStr()});
  });
  (old.transfers||[]).forEach(t=>{
    movements.push({id:uid(), tipo:'transferencia', estado:'pago', data:t.data||`${CUR_YEAR}-01-01`,
      dataPagamento:t.data||`${CUR_YEAR}-01-01`, valor:Number(t.valor)||0, valorPago:Number(t.valor)||0,
      categoria:'Transferência', subcategoria:'', unitId:null, origem:t.origem, destino:t.destino,
      entidade:'', notas:t.descricao||'', referencia:'', anexo:'', reciboEmitido:'N/A', recurrenceId:null, periodKey:null, criadoEm:todayStr()});
  });
  (old.reminders||[]).forEach(r=>{
    const rec = {id:uid(), nome:r.nome, tipo:'despesa', categoria:r.categoria, subcategoria:'',
      valorHabitual:Number(r.valorHabitual)||0, unitId:null, frequencia:'mensal', diaVencimento:1,
      dataInicio:`${CUR_YEAR}-01-01`, ativo:true, ultimaGeracao:''};
    recurrences.push(rec);
    (r.months||[]).forEach((m,i)=>{
      if(m.pago || Number(m.valor)>0){
        const dataStr = m.data || `${CUR_YEAR}-${String(i+1).padStart(2,'0')}-01`;
        movements.push({id:uid(), tipo:'despesa', estado:m.pago?'pago':'previsto', data:dataStr,
          dataPagamento:m.pago?dataStr:'', valor:Number(m.valor)||0, valorPago:m.pago?Number(m.valor)||0:0,
          categoria:r.categoria, subcategoria:'', unitId:null, origem:null, destino:null,
          entidade:r.nome, notas:'', referencia:'', anexo:'', reciboEmitido:'N/A',
          recurrenceId:rec.id, periodKey:`${CUR_YEAR}-${String(i+1).padStart(2,'0')}`, criadoEm:todayStr()});
      }
    });
  });
  return {version:2, units, movements, recurrences, contasFinanceiras:[]};
}

async function loadState(){
  try{
    const rawV2 = localStorage.getItem("financas-v2");
    if(rawV2){
      state = JSON.parse(rawV2);
      if(!state.recurrences) state.recurrences=[];
      if(!state.contasFinanceiras) state.contasFinanceiras=[];
      state.contasFinanceiras.forEach(c=>{ if(c.saldoInicial===undefined) c.saldoInicial = Number(c.saldo)||0; });
      ensureRecurrenceMovements(); persist(); return;
    }
    const rawV1 = localStorage.getItem("financas-v1");
    if(rawV1){
      const old = JSON.parse(rawV1);
      state = migrateV1toV2(old);
      ensureRecurrenceMovements();
      persist();
      return;
    }
  }catch(e){ console.error("Erro ao ler dados guardados:", e); }
  state = seedState();
  persist();
}
function persist(){
  try{ localStorage.setItem("financas-v2", JSON.stringify(state)); }
  catch(e){ console.error("Erro ao guardar:", e); }
}

function fmt(n){ n = Number(n)||0; return n.toLocaleString('pt-PT',{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }

// ---------- recorrências ----------
function allOccurrencesUpTo(r, now){
  const stepMonths = {mensal:1, trimestral:3, semestral:6, anual:12}[r.frequencia] || 1;
  let d = new Date(r.dataInicio || todayStr());
  if(isNaN(d.getTime())) d = new Date(todayStr());
  const occs = [];
  let guard = 0;
  while(d <= now && guard < 500){
    occs.push(new Date(d));
    d = new Date(d);
    d.setMonth(d.getMonth()+stepMonths);
    guard++;
  }
  return occs;
}
function ensureRecurrenceMovements(){
  const now = new Date();
  (state.recurrences||[]).filter(r=>r.ativo).forEach(r=>{
    try{
      const occs = allOccurrencesUpTo(r, now);
      occs.forEach(occ=>{
        const pk = occ.toISOString().slice(0,7)+'-'+occ.getDate();
        const exists = state.movements.some(m=>m.recurrenceId===r.id && m.periodKey===pk);
        if(!exists){
          state.movements.push({id:uid(), tipo:r.tipo, estado:'previsto', data:occ.toISOString().slice(0,10),
            dataPagamento:'', valor:Number(r.valorHabitual)||0, valorPago:0, categoria:r.categoria, subcategoria:r.subcategoria||'',
            unitId:r.unitId||null, origem:null, destino:null, entidade:r.nome, notas:'', referencia:'', anexo:'',
            reciboEmitido:'N/A', recurrenceId:r.id, periodKey:pk, criadoEm:todayStr()});
        }
      });
    }catch(e){ console.error('Erro ao gerar movimentos para lembrete', r.nome, e); }
  });
}

// ---------- cálculos ----------
function effectiveEstado(m){
  if(m.estado==='previsto' && m.data && m.data < todayStr()) return 'vencido';
  return m.estado;
}
function realizedValue(m){
  const eff = effectiveEstado(m);
  if(eff==='pago') return Number(m.valor)||0;
  if(eff==='parcial') return Number(m.valorPago)||0;
  return 0;
}
function movementNetEffect(m, accountId){
  if(m.tipo==='transferencia'){
    const v = realizedValue({...m, estado:m.estado}); // transfers use valor directly (assume always fully executed once 'pago')
    const realized = effectiveEstado(m)==='pago' ? Number(m.valor)||0 : realizedValue(m);
    if(m.destino===accountId) return realized;
    if(m.origem===accountId) return -realized;
    return 0;
  }
  const belongsToAccount = (accountId==='despesas') ? (m.unitId===null || m.unitId===undefined) : (m.unitId===accountId);
  if(!belongsToAccount) return 0;
  const val = realizedValue(m);
  if(m.tipo==='receita' || m.tipo==='reembolso') return val;
  if(m.tipo==='despesa') return -val;
  if(m.tipo==='ajuste') return val; // valor pode ser negativo
  return 0; // caucao excluída do saldo
}
function accountSaldo(accountId){
  return state.movements.reduce((s,m)=> s + movementNetEffect(m, accountId), 0);
}
function unitTotals(u){
  const mv = state.movements.filter(m=>m.unitId===u.id);
  const recebido = mv.filter(m=>m.tipo==='receita').reduce((s,m)=>s+realizedValue(m),0);
  const condo = mv.filter(m=>m.categoria==='Condomínio' && m.tipo==='despesa').reduce((s,m)=>s+realizedValue(m),0);
  const imiPago = mv.filter(m=>m.categoria==='IMI').reduce((s,m)=>s+realizedValue(m),0);
  const imiTotal = mv.filter(m=>m.categoria==='IMI' && m.estado!=='anulado').reduce((s,m)=>s+(Number(m.valor)||0),0);
  const esperado = (Number(u.rendaMensal)||0) * 12;
  const pct = esperado>0 ? Math.min(100, Math.round((recebido/esperado)*100)) : 0;
  const saldo = accountSaldo(u.id);

  const pagos = mv.filter(m=>effectiveEstado(m)==='pago' && m.dataPagamento).sort((a,b)=>b.dataPagamento.localeCompare(a.dataPagamento));
  const ultimoPagamento = pagos.length ? pagos[0].dataPagamento : '';
  const futuros = mv.filter(m=>{ const e=effectiveEstado(m); return (e==='previsto'||e==='vencido') && m.data; }).sort((a,b)=>a.data.localeCompare(b.data));
  const proximoVencimento = futuros.length ? futuros[0].data : '';

  const year = new Date().getFullYear();
  const recebidoAno = mv.filter(m=>m.tipo==='receita' && m.data && m.data.slice(0,4)===String(year)).reduce((s,m)=>s+realizedValue(m),0);
  const despesasAno = mv.filter(m=>m.tipo==='despesa' && m.data && m.data.slice(0,4)===String(year)).reduce((s,m)=>s+realizedValue(m),0);
  const valorAquisicao = Number(u.valorAquisicao)||0;
  const yieldBruta = valorAquisicao>0 ? (esperado/valorAquisicao*100) : null;
  const yieldLiquida = valorAquisicao>0 ? ((recebidoAno-despesasAno)/valorAquisicao*100) : null;

  return {recebido, condo, imiPago, imiTotal, esperado, pct, saldo, ultimoPagamento, proximoVencimento, recebidoAno, despesasAno, yieldBruta, yieldLiquida};
}
function renderYieldStats(u){
  const t = unitTotals(u);
  const valorAtual = Number(u.valorAtualEstimado)||0;
  const divida = Number(u.dividaAssociada)||0;
  const liquido = valorAtual - divida;
  if(!u.valorAquisicao && !u.valorAtualEstimado){
    return `<p class="helpbox">Preencha o valor de aquisição para calcular a rentabilidade (yield).</p>`;
  }
  return `
    <div class="stat-row" style="margin-top:4px;">
      <div class="stat"><div class="label">Yield bruta</div><div class="value">${t.yieldBruta!==null?t.yieldBruta.toFixed(2)+'%':'—'}</div></div>
      <div class="stat"><div class="label">Yield líquida (${new Date().getFullYear()})</div><div class="value">${t.yieldLiquida!==null?t.yieldLiquida.toFixed(2)+'%':'—'}</div></div>
    </div>
    <div class="stat ${liquido>=0?'pos':'neg'}"><div class="label">Património líquido desta unidade</div><div class="value">${fmt(liquido)}</div></div>
  `;
}
function despesasSaldoInfo(){
  const mv = state.movements.filter(m=> (m.unitId===null||m.unitId===undefined) && m.tipo!=='transferencia');
  const receitas = mv.filter(m=>m.tipo==='receita'||m.tipo==='reembolso').reduce((s,m)=>s+realizedValue(m),0);
  const despesas = mv.filter(m=>m.tipo==='despesa').reduce((s,m)=>s+realizedValue(m),0);
  const saldo = accountSaldo('despesas');
  return {receitas, despesas, saldo};
}
function accountName(id){
  if(id==='despesas'||id===null||id===undefined) return 'Despesas (salário)';
  const u = state.units.find(u=>u.id===id); if(u) return u.nome;
  const c = state.contasFinanceiras.find(c=>c.id===id); if(c) return c.nome+' ('+c.tipo+')';
  return '—';
}
function contaSaldoTotal(c){ return (Number(c.saldoInicial)||0) + accountSaldo(c.id); }

// alertas: vencidas / este mês / próximas (30 dias)
function computeAlerts(){
  const today = todayStr();
  const now = new Date();
  const endOfMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).toISOString().slice(0,10);
  const horizon = new Date(now); horizon.setDate(horizon.getDate()+30);
  const horizonStr = horizon.toISOString().slice(0,10);
  const groups = {vencida:[], esteMes:[], proxima:[]};
  state.movements.forEach(m=>{
    if(m.tipo==='transferencia') return;
    const eff = effectiveEstado(m);
    if(eff!=='previsto' && eff!=='parcial' && eff!=='vencido') return;
    if(!m.data) return;
    const label = `${m.categoria}${m.entidade? ' — '+m.entidade:''}`;
    const unitName = accountName(m.unitId);
    const item = {id:m.id, unitId:m.unitId, unitName, label, valor:m.valor, data:m.data};
    if(eff==='vencido' || m.data < today) groups.vencida.push(item);
    else if(m.data <= endOfMonth) groups.esteMes.push(item);
    else if(m.data <= horizonStr) groups.proxima.push(item);
  });
  return groups;
}
function totalAlertCount(){ const g = computeAlerts(); return g.vencida.length+g.esteMes.length+g.proxima.length; }

function renderMonthlyChart(){
  const lineC = cssVar('--line') || '#E7E8EF';
  const successC = cssVar('--success') || '#0EA968';
  const inkSoftC = cssVar('--ink-soft') || '#6B7280';
  const year = new Date().getFullYear();
  const esperado = new Array(12).fill(0), recebido = new Array(12).fill(0);
  state.units.forEach(u=>{ for(let i=0;i<12;i++) esperado[i]+=Number(u.rendaMensal)||0; });
  state.movements.filter(m=>m.tipo==='receita' && m.data && m.data.slice(0,4)===String(year)).forEach(m=>{
    const mo = Number(m.data.slice(5,7))-1; recebido[mo]+=realizedValue(m);
  });
  const max = Math.max(1, ...esperado, ...recebido);
  const w=300, h=110, slot=w/12;
  let bars='';
  for(let i=0;i<12;i++){
    const x=i*slot, hE=(esperado[i]/max)*h, hR=(recebido[i]/max)*h;
    bars += `<rect x="${x+1.5}" y="${h-hE}" width="${slot/2-2}" height="${hE}" fill="${lineC}"/>`;
    bars += `<rect x="${x+slot/2}" y="${h-hR}" width="${slot/2-2}" height="${hR}" fill="${successC}"/>`;
  }
  const meses=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
  let ticks='';
  [0,3,6,9].forEach(i=> ticks += `<text x="${i*slot+2}" y="${h+11}" font-size="7.5" font-family="IBM Plex Mono, monospace" fill="${inkSoftC}">${meses[i]}</text>`);
  return `<svg viewBox="0 0 ${w} ${h+16}" style="width:100%;height:auto;display:block;">${bars}<line x1="0" y1="${h}" x2="${w}" y2="${h}" stroke="${lineC}" stroke-width="1"/>${ticks}</svg>
    <div class="chart-legend"><span><span class="sw" style="background:${lineC};"></span>Esperado</span><span><span class="sw" style="background:${successC};"></span>Recebido ${year}</span></div>`;
}
function renderCategoriaChart(){
  const primaryC = cssVar('--primary') || '#5B4FE9';
  const map = {};
  state.movements.filter(m=>m.tipo==='despesa' && (m.unitId===null||m.unitId===undefined)).forEach(m=>{
    map[m.categoria] = (map[m.categoria]||0) + realizedValue(m);
  });
  const entries = Object.entries(map).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  if(entries.length===0) return '<div class="empty">Ainda sem despesas registadas.</div>';
  const max = Math.max(...entries.map(e=>e[1]));
  return entries.map(([cat,val])=>`
    <div style="margin-bottom:8px;">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px;"><span>${escapeHtml(cat)}</span><span style="font-family:'IBM Plex Mono',monospace;">${fmt(val)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(3,Math.round((val/max)*100))}%;background:${primaryC};"></div></div>
    </div>`).join('');
}

// ---------- pesquisa global ----------
let buscaPreset = null;
function gotoBusca(preset){ buscaPreset = preset || {}; goto('busca'); }
function availableYears(){
  const set = new Set(state.movements.filter(m=>m.data).map(m=>m.data.slice(0,4)));
  const arr = Array.from(set).sort().reverse();
  return arr.length? arr : [String(new Date().getFullYear())];
}
function filterMovements(f){
  return state.movements.filter(m=>{
    if(m.tipo==='transferencia' && f.tipo && f.tipo!=='todos' && f.tipo!=='transferencia') return false;
    if(f.texto){
      const hay = `${m.categoria||''} ${m.subcategoria||''} ${m.entidade||''} ${m.notas||''} ${m.referencia||''}`.toLowerCase();
      if(!hay.includes(f.texto.toLowerCase())) return false;
    }
    if(f.unitId && f.unitId!=='todos'){
      if(f.unitId==='despesas'){ if(!(m.unitId===null||m.unitId===undefined) && m.origem!=='despesas' && m.destino!=='despesas') return false; }
      else if(m.unitId!==f.unitId && m.origem!==f.unitId && m.destino!==f.unitId) return false;
    }
    if(f.categoria && f.categoria!=='todos' && m.categoria!==f.categoria) return false;
    if(f.tipo && f.tipo!=='todos' && m.tipo!==f.tipo) return false;
    if(f.estado && f.estado!=='todos' && effectiveEstado(m)!==f.estado) return false;
    if(f.ano && f.ano!=='todos' && (!m.data || m.data.slice(0,4)!==f.ano)) return false;
    if(f.mes && f.mes!=='todos' && (!m.data || m.data.slice(5,7)!==f.mes)) return false;
    if(f.meio && f.meio!=='todos' && (m.meioPagamento||'Não especificado')!==f.meio) return false;
    return true;
  });
}
function renderBusca(){
  const p = buscaPreset || {};
  let results, title;
  if(p.group==='vencida'){ results = computeAlerts().vencida; title = 'Vencidas'; return renderBuscaAlertGroup(results, title); }
  if(p.group==='proxima30'){
    const g = computeAlerts(); results = [...g.esteMes, ...g.proxima]; title = 'Previstas — próximos 30 dias';
    return renderBuscaAlertGroup(results, title);
  }
  if(p.group==='recebermes'){
    const now = new Date(); const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    const mv = state.movements.filter(m=>m.tipo==='receita' && m.data && m.data.slice(0,7)===monthKey && effectiveEstado(m)!=='pago' && effectiveEstado(m)!=='anulado');
    return renderBuscaMovements(mv, 'A receber este mês');
  }
  if(p.group==='dinheiro'){
    const mv = state.movements.filter(m=>(m.meioPagamento||'Não especificado')==='Dinheiro' && m.tipo!=='transferencia' && effectiveEstado(m)!=='anulado');
    return renderBuscaMovements(mv, 'Movimentos em dinheiro');
  }

  const years = availableYears();

function renderDashboard(){
  const now = new Date(); const year = now.getFullYear(); const month = now.getMonth();
  const monthKey = `${year}-${String(month+1).padStart(2,'0')}`;
  const isThisMonth = (m)=> m.data && m.data.slice(0,7)===monthKey;

  const saldoMes = state.movements.filter(m=>m.tipo!=='transferencia' && isThisMonth(m)).reduce((s,m)=>{
    const v = realizedValue(m);
    if(m.tipo==='receita'||m.tipo==='reembolso') return s+v;
    if(m.tipo==='despesa') return s-v;
    if(m.tipo==='ajuste') return s+v;
    return s;
  },0);
  const aReceberMes = state.movements.filter(m=>m.tipo==='receita' && isThisMonth(m) && effectiveEstado(m)!=='pago' && effectiveEstado(m)!=='anulado')
    .reduce((s,m)=> s + (Number(m.valor)||0) - realizedValue(m), 0);
  const g = computeAlerts();
  const emAtraso = g.vencida.reduce((s,i)=>s+(Number(i.valor)||0),0);
  const horizon = new Date(now); horizon.setDate(horizon.getDate()+30);
  const despesasPrevistas30 = state.movements.filter(m=>m.tipo==='despesa' && m.data>=todayStr() && m.data<=horizon.toISOString().slice(0,10) && effectiveEstado(m)!=='pago' && effectiveEstado(m)!=='anulado')
    .reduce((s,m)=>s+(Number(m.valor)||0),0);

  const totals = state.units.map(unitTotals);
  const recebidoTotal = totals.reduce((s,t)=>s+t.recebido,0);
  const esperadoTotal = totals.reduce((s,t)=>s+t.esperado,0);
  const pct = esperadoTotal>0 ? Math.min(100, Math.round((recebidoTotal/esperadoTotal)*100)) : 0;
  const dInfo = despesasSaldoInfo();

  const backupWarning = renderBackupWarning();

  let unitsRows = state.units.map(u=>{
    const t = unitTotals(u);
    return `<div class="unit-row" data-open-unit="${u.id}">
      <div><div class="unit-name">${escapeHtml(u.nome)} <span class="chip-status ${u.estado}">${estadoUnidadeLabel(u.estado)}</span></div><div class="unit-meta">${u.tipo} · ${fmt(t.recebido)} recebido · saldo ${fmt(t.saldo)}</div></div>
      <div class="unit-pct">${t.pct}%</div>
    </div>`;
  }).join('');

  return `
    ${backupWarning}
    ${quickActionsHtml()}
    <div class="card">
      <h2>Este mês</h2>
      <div class="stat-row">
        <div class="stat ${saldoMes>=0?'pos':'neg'} clickable" data-go="despesas"><div class="label">Saldo do mês</div><div class="value">${fmt(saldoMes)}</div></div>
        <div class="stat clickable" data-go-busca="recebermes"><div class="label">A receber (mês)</div><div class="value">${fmt(aReceberMes)}</div></div>
      </div>
      <div class="stat-row">
        <div class="stat neg clickable" data-go-busca="vencida"><div class="label">Em atraso</div><div class="value">${fmt(emAtraso)}</div></div>
        <div class="stat clickable" data-go-busca="proxima30"><div class="label">Despesas (30 dias)</div><div class="value">${fmt(despesasPrevistas30)}</div></div>
      </div>
      <div class="stat-row">
        <div class="stat clickable" data-go-busca="dinheiro"><div class="label">Dinheiro em caixa</div><div class="value">${fmt(cashOnHand())}</div></div>
      </div>
    </div>
    ${renderPendenciasCard()}
    <div class="card">
      <div class="row-actions" style="margin-bottom:12px;"><button class="btn small secondary" id="printGeralBtn">Imprimir relatório geral</button></div>
      <h2>Rendas — todas as unidades</h2>
      <div class="stat-row">
        <div class="stat pos"><div class="label">Recebido</div><div class="value">${fmt(recebidoTotal)}</div></div>
        <div class="stat"><div class="label">Esperado (ano)</div><div class="value">${fmt(esperadoTotal)}</div></div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 14px;">${pct}% da renda anual esperada já recebida</div>
      ${renderMonthlyChart()}
    </div>
    <div class="card">
      <h2>Salário e despesas</h2>
      <div class="stat-row">
        <div class="stat pos"><div class="label">Receitas</div><div class="value">${fmt(dInfo.receitas)}</div></div>
        <div class="stat neg"><div class="label">Despesas</div><div class="value">${fmt(dInfo.despesas)}</div></div>
      </div>
      <div class="stat ${dInfo.saldo>=0?'pos':'neg'}" style="margin-bottom:14px;"><div class="label">Saldo atual</div><div class="value">${fmt(dInfo.saldo)}</div></div>
      <h3>Despesas por categoria</h3>
      ${renderCategoriaChart()}
    </div>
    <div class="card">
      <h2>Por unidade</h2>
      ${unitsRows || '<div class="empty">Ainda sem unidades.</div>'}
    </div>
  `;
}

function movementRowHtml(m, contextAccountId){
  const eff = effectiveEstado(m);
  let desc, metaExtra = '', valClass = 'neutral', sign = '';
  if(m.tipo==='transferencia'){
    desc = `${accountName(m.origem)} → ${accountName(m.destino)}`;
    if(contextAccountId!==undefined){
      if(m.destino===contextAccountId){ valClass='pos'; sign='+'; }
      else if(m.origem===contextAccountId){ valClass='neg'; sign='-'; }
    }
  } else {
    desc = `${m.categoria}${m.entidade? ' — '+escapeHtml(m.entidade):''}`;
    if(m.tipo==='receita'||m.tipo==='reembolso'){ valClass='pos'; sign='+'; }
    else if(m.tipo==='despesa'){ valClass='neg'; sign='-'; }
    else if(m.tipo==='ajuste'){ valClass = (Number(m.valor)>=0)?'pos':'neg'; sign=''; }
  }
  const valorMostrado = eff==='parcial' ? `${fmt(m.valorPago)} / ${fmt(m.valor)}` : fmt(m.valor);
  return `<div class="mv-row" data-edit-mv="${m.id}">
    <div class="mv-left">
      <div class="mv-desc">${desc}</div>
      <div class="mv-meta">
        <span class="chip-tipo ${m.tipo}">${tipoLabel(m.tipo)}</span>
        <span class="chip-status ${eff}">${estadoLabel(eff)}</span>
        <span>${m.data||'—'}</span>
        ${m.meioPagamento==='Dinheiro' ? '<span class="chip-tipo" style="background:var(--warn-soft);color:var(--warn);">💶 Dinheiro</span>' : ''}
      </div>
    </div>
    <div class="mv-right"><div class="mv-val ${valClass}">${sign}${valorMostrado}</div></div>
  </div>`;
}

function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }

function buildPrintFiltered(ano, unitId, categoria){
  let mv = [...state.movements];
  if(ano && ano!=='todos') mv = mv.filter(m=>m.data && m.data.slice(0,4)===ano);
  if(unitId && unitId!=='todos') mv = mv.filter(m=>m.unitId===unitId || m.origem===unitId || m.destino===unitId);
  if(categoria && categoria!=='todos') mv = mv.filter(m=>m.categoria===categoria);
  mv.sort((a,b)=>(a.data||'').localeCompare(b.data||''));

  const totalReceita = mv.filter(m=>m.tipo==='receita').reduce((s,m)=>s+realizedValue(m),0);
  const totalDespesa = mv.filter(m=>m.tipo==='despesa').reduce((s,m)=>s+realizedValue(m),0);
  const rows = mv.map(m=>{
    const conta = m.tipo==='transferencia' ? `${accountName(m.origem)} → ${accountName(m.destino)}` : accountName(m.unitId);
    return `<tr><td>${m.data||'—'}</td><td>${conta}</td><td>${tipoLabel(m.tipo)}</td><td>${m.categoria||''}</td><td>${estadoLabel(effectiveEstado(m))}</td><td>${fmt(m.valor)}</td></tr>`;
  }).join('');
  const filtroDesc = [
    ano&&ano!=='todos' ? 'Ano: '+ano : null,
    unitId&&unitId!=='todos' ? 'Conta: '+accountName(unitId) : null,
    categoria&&categoria!=='todos' ? 'Categoria: '+categoria : null
  ].filter(Boolean).join(' · ') || 'Sem filtros (tudo)';
  return `
    <div class="printhead">Relatório Filtrado</div>
    <div class="printsub">${filtroDesc} · Gerado em ${new Date().toLocaleDateString('pt-PT')}</div>
    <div class="printsection">Totais</div>
    <table class="printtable"><tbody>
      <tr><td>Total Receitas</td><td>${fmt(totalReceita)}</td></tr>
      <tr><td>Total Despesas</td><td>${fmt(totalDespesa)}</td></tr>
      <tr><td>Saldo</td><td>${fmt(totalReceita-totalDespesa)}</td></tr>
    </tbody></table>
    <div class="printsection">Movimentos (${mv.length})</div>
    <table class="printtable"><thead><tr><th>Data</th><th>Conta</th><th>Tipo</th><th>Categoria</th><th>Estado</th><th>Valor</th></tr></thead><tbody>${rows}</tbody></table>
  `;
}

// ---------- Excel ----------
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = ()=>reject(new Error('falha ao carregar '+src));
    document.head.appendChild(s);
  });
}
async function exportExcel(){
  const statusEl = document.getElementById('excelStatus');
  const btn = document.getElementById('exportExcelBtn');
  try{
    if(statusEl) statusEl.textContent = 'A preparar...';
    if(btn) btn.disabled = true;
    if(!window.ExcelJS) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js');
    const wb = new ExcelJS.Workbook();
    const NAVY = 'FF1B2A4A';
    const headerStyle = (cell)=>{ cell.fill = {type:'pattern',pattern:'solid',fgColor:{argb:NAVY}}; cell.font = {bold:true,color:{argb:'FFFFFFFF'}}; };
    const titleStyle = (cell)=>{ cell.font = {bold:true,size:14,color:{argb:NAVY}}; };

    const dash = wb.addWorksheet('Dashboard');
    dash.columns = [{width:20},{width:12},{width:12},{width:16},{width:16},{width:10},{width:14}];
    dash.getCell('A1').value = 'Dashboard — Resumo Geral'; titleStyle(dash.getCell('A1'));
    ['Unidade','Tipo','Estado','Renda Mensal','Total Recebido','%','Saldo'].forEach((h,i)=>{ const c = dash.getCell(3,i+1); c.value=h; headerStyle(c); });
    state.units.forEach((u,idx)=>{
      const t = unitTotals(u); const row = 4+idx;
      dash.getCell(row,1).value=u.nome; dash.getCell(row,2).value=u.tipo; dash.getCell(row,3).value=estadoUnidadeLabel(u.estado);
      dash.getCell(row,4).value=Number(u.rendaMensal)||0; dash.getCell(row,5).value=t.recebido;
      dash.getCell(row,6).value=t.pct/100; dash.getCell(row,6).numFmt='0%'; dash.getCell(row,7).value=t.saldo;
      [4,5,7].forEach(c=> dash.getCell(row,c).numFmt='#,##0.00 "€"');
    });

    const mvSheet = wb.addWorksheet('Movimentos');
    mvSheet.columns = [{width:12},{width:14},{width:14},{width:20},{width:16},{width:14},{width:12},{width:12},{width:20},{width:24}];
    ['Data','Tipo','Estado','Unidade','Categoria','Subcategoria','Valor (€)','Valor Pago (€)','Entidade','Notas'].forEach((h,i)=>{ const c=mvSheet.getCell(1,i+1); c.value=h; headerStyle(c); });
    [...state.movements].sort((a,b)=>(a.data||'').localeCompare(b.data||'')).forEach((m,i)=>{
      const row = 2+i;
      mvSheet.getCell(row,1).value = m.data||'';
      mvSheet.getCell(row,2).value = tipoLabel(m.tipo);
      mvSheet.getCell(row,3).value = estadoLabel(effectiveEstado(m));
      mvSheet.getCell(row,4).value = m.tipo==='transferencia' ? `${accountName(m.origem)} → ${accountName(m.destino)}` : accountName(m.unitId);
      mvSheet.getCell(row,5).value = m.categoria||'';
      mvSheet.getCell(row,6).value = m.subcategoria||'';
      mvSheet.getCell(row,7).value = Number(m.valor)||0; mvSheet.getCell(row,7).numFmt='#,##0.00 "€"';
      mvSheet.getCell(row,8).value = Number(m.valorPago)||0; mvSheet.getCell(row,8).numFmt='#,##0.00 "€"';
      mvSheet.getCell(row,9).value = m.entidade||'';
      mvSheet.getCell(row,10).value = m.notas||'';
    });

    const rec = wb.addWorksheet('Lembretes');
    rec.columns = [{width:20},{width:14},{width:16},{width:14},{width:12},{width:12}];
    ['Nome','Categoria','Ligado a','Frequência','Valor Habitual (€)','Ativo'].forEach((h,i)=>{ const c=rec.getCell(1,i+1); c.value=h; headerStyle(c); });
    state.recurrences.forEach((r,i)=>{
      const row=2+i;
      rec.getCell(row,1).value=r.nome; rec.getCell(row,2).value=r.categoria; rec.getCell(row,3).value=accountName(r.unitId);
      rec.getCell(row,4).value=(FREQUENCIAS.find(f=>f.v===r.frequencia)||{}).l||r.frequencia;
      rec.getCell(row,5).value=Number(r.valorHabitual)||0; rec.getCell(row,5).numFmt='#,##0.00 "€"';
      rec.getCell(row,6).value=r.ativo?'Sim':'Não';
    });

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download='Livro-de-Contas.xlsx';
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    if(statusEl) statusEl.textContent = 'Ficheiro Excel gerado.';
  }catch(err){
    console.error(err);
    if(statusEl) statusEl.textContent = 'Não foi possível gerar o Excel (verifique a ligação à internet).';
  }finally{ if(btn) btn.disabled = false; }
}

// ---------- backup encriptado ----------
async function deriveKey(passphrase, saltBytes){
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:saltBytes, iterations:150000, hash:'SHA-256'},
    keyMaterial, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
function bufToB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64){ const bin = atob(b64); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr; }
async function encryptJson(obj, passphrase){
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(passphrase, salt);
  const cipherBuf = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
  return { encrypted:true, v:1, salt:bufToB64(salt), iv:bufToB64(iv), data:bufToB64(cipherBuf) };
}
async function decryptJson(payload, passphrase){
  const salt = b64ToBuf(payload.salt), iv = b64ToBuf(payload.iv), data = b64ToBuf(payload.data);
  const key = await deriveKey(passphrase, salt);
  const plainBuf = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, data);
  return JSON.parse(new TextDecoder().decode(plainBuf));
}

function showLockScreen(){
  const lock = document.createElement('div');
  lock.id = 'lockScreen';
  lock.innerHTML = `<div class="box"><h1>Livro de Contas</h1><p>Introduza o código de acesso</p>
    <input type="password" inputmode="numeric" id="pinInput" maxlength="6" autofocus>
    <div class="err" id="pinErr"></div>
    <button class="btn gold block" id="unlockBtn">Entrar</button></div>`;
  document.body.appendChild(lock);
  document.getElementById('app').style.display = 'none';
  const tryUnlock = ()=>{
    const val = document.getElementById('pinInput').value.trim();
    const stored = localStorage.getItem('financas-pin');
    if(simpleHash(val)===stored){ lock.remove(); document.getElementById('app').style.display='flex'; }
    else{ document.getElementById('pinErr').textContent='Código incorreto.'; document.getElementById('pinInput').value=''; }
  };
  document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
  document.getElementById('pinInput').addEventListener('keydown', (ev)=>{ if(ev.key==='Enter') tryUnlock(); });
}
